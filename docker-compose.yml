version: '3.8'

services:
  # 1. Neo4j Ontology Layer
  neo4j:
    image: neo4j:5-community
    container_name: vurafya_ontology
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me-neo4j-password}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # 2. PostgreSQL Main Database
  postgres:
    image: postgres:15-alpine
    container_name: vurafya_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cdfd}
      - POSTGRES_USER=${POSTGRES_USER:-cdfd}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-postgres-password}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Redis Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: vurafya_cache
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # 4. Vurafya Backend (Python + Engine)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vurafya_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cdfd}:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/${POSTGRES_DB:-cdfd}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change-me-neo4j-password}
      - REDIS_URL=redis://redis:6379/0
      - ENGINE_PATH=/engine
      - PYTHONPATH=/app:/engine
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEMO_LOGIN_ENABLED=${DEMO_LOGIN_ENABLED:-true}
      - ENABLE_BACKGROUND_WORKER=${ENABLE_BACKGROUND_WORKER:-false}
      - ENABLE_MODEL_AUTOMATIONS=${ENABLE_MODEL_AUTOMATIONS:-false}
      - RUNTIME_PERSIST_ON_READ=${RUNTIME_PERSIST_ON_READ:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      - neo4j
      - postgres
      - redis
    volumes:
      - .:/app
      - ../CDFD-Runtime:/engine:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # 5. Vurafya Doctor Portal (React)
  doctor_portal:
    build:
      context: ./vurafya_web
    container_name: vurafya_web
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  neo4j_data:
  postgres_data:
